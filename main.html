<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Insurance Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 650px;
        }
        
        h1 {
            color: #1e3c72;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 15px;
        }
        
        form {
            display: flex;
            flex-direction: column;
        }
        
        .form-group {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
        }
        
        label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        input[type="password"],
        select {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 10px rgba(42, 82, 152, 0.3);
            transform: translateY(-2px);
        }
        
        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="number"]::placeholder,
        input[type="password"]::placeholder {
            color: #999;
        }
        
        .radio-group {
            display: flex;
            gap: 25px;
            margin-top: 8px;
        }
        
        .radio-group label {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            text-transform: none;
            letter-spacing: normal;
            cursor: pointer;
            font-weight: normal;
            gap: 8px;
        }
        
        input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2a5298;
        }
        
        button[type="submit"] {
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(42, 82, 152, 0.4);
        }
        
        button[type="submit"]:active {
            transform: translateY(-1px);
        }
        
        .required {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Car Insurance</h1>
        <p class="subtitle">Register for comprehensive car insurance coverage</p>
        
        <form method="POST" action="#">
            <!-- Name Field -->
            <div class="form-group">
                <label for="name">Name <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Enter your full name"
                    required
                >
            </div>
            
            <!-- Email Field -->
            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email address"
                    required
                >
            </div>
            
            <!-- Gender Radio Buttons -->
            <div class="form-group">
                <label>Gender <span class="required">*</span></label>
                <div class="radio-group">
                    <label>
                        <input 
                            type="radio" 
                            name="gender" 
                            value="Male"
                            required
                        >
                        Male
                    </label>
                    <label>
                        <input 
                            type="radio" 
                            name="gender" 
                            value="Female"
                            required
                        >
                        Female
                    </label>
                    <label>
                        <input 
                            type="radio" 
                            name="gender" 
                            value="Other"
                            required
                        >
                        Other
                    </label>
                </div>
            </div>
            
            <!-- Car Brands Dropdown -->
            <div class="form-group">
                <label for="cars">Car Brands</label>
                <select 
                    id="cars" 
                    name="cars"
                >
                    <option value="">--Please choose an option--</option>
                    <option value="BMW">BMW</option>
                    <option value="Audi">Audi</option>
                    <option value="Mercedez">Mercedez</option>
                </select>
            </div>
            
            <!-- Car Age Field -->
            <div class="form-group">
                <label for="carage">Car Age <span class="required">*</span></label>
                <input 
                    type="number" 
                    id="carage" 
                    name="carage" 
                    placeholder="Enter car age in years"
                    required
                >
            </div>
            
            <!-- Date of Purchase Field -->
            <div class="form-group">
                <label for="dop">Date of Purchase <span class="required">*</span></label>
                <input 
                    type="date" 
                    id="dop" 
                    name="dop"
                    required
                >
            </div>
            
            <!-- Password Field -->
            <div class="form-group">
                <label for="password">Password <span class="required">*</span></label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter a secure password"
                    required
                >
            </div>
            
            <!-- Submit Button -->
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
